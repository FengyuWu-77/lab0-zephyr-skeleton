CONFIG_GPIO=y

# Console and UART output
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Zephyr Logger
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Keep TWIM1/I2C1 available to the non-secure application.
# TF-M's default secure UART1 shares the same peripheral ID.
CONFIG_TFM_SECURE_UART=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# BME280 sensor + I2C
CONFIG_SENSOR=y
CONFIG_I2C=y
